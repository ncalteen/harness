pipeline:
  stages:
    - steps:
        - run:
            script: echo "$(date +%T)"
            shell: bash
          name: Timestamp
          id: Timestamp
      name: Init
      id: Init
    - id: nodeNpmBuildTestHostedLinuxStage_1
      name: Node npm Build and Test on Harness Cloud (Linux)
      clone:
        enabled: true
      cache:
        enabled: true
      steps:
        - id: setupNode
          name: Setup Node
          template:
            uses: setupNode@1.0.0
        - name: Install pnpm
          run:
            script: npm i -g pnpm
          id: Install_pnpm
        - id: installDependenciesLinux
          name: Install Dependencies on Linux
          run:
            shell: bash
            script: pnpm ci
        - name: CI Checks
          id: CI_Checks
          parallel:
            steps:
              - name: Formatting
                run:
                  script: pnpm run format:check
                id: Formatting
              - name: Unit Tests
                run-test:
                  script: |-
                    mkdir -p coverage reports
                    pnpm run test
                    # Node's junit reporter emits testcase nodes directly under testsuites
                    # with no testsuite wrapper; Harness's parser requires the nested form.
                    sed -e 's#<testsuites>#<testsuites><testsuite name="node-test">#' -e 's#</testsuites>#</testsuite></testsuites>#' reports/junit-raw.xml > reports/junit.xml
                  intelligence: {}
                id: Unit_Tests
              - name: Playwright Tests
                run:
                  script: |-
                    pnpm run test:e2e:install
                    pnpm run test:e2e
                id: Playwright_Tests
        - name: Upload Coverage
          run:
            script: hcli cov upload
            env:
              CI_ENABLE_HCLI_FOR_TESTS: "true"
          id: Upload_Coverage
        - id: Build
          name: Build
          run:
            shell: bash
            script: pnpm run build --if-present
