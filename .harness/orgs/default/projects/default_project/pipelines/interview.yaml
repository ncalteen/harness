pipeline:
  name: Next.js App
  tags: {}
  stages:
    - name: Build and Test (Harness Cloud)
      id: Build_and_Test_Harness_Cloud
      description: Builds and tests the application using Harness Cloud
      env:
        PNPM_VERSION: 12
      clone:
        enabled: true
      cache:
        enabled: true
      steps:
        - id: setupNode
          name: Setup Node
          template:
            uses: setupNode@1.0.0
        - id: install
          name: Install Dependencies
          run:
            shell: bash
            script: npx "pnpm@$PNPM_VERSION" ci
        - parallel:
            steps:
              - name: Check Format
                run:
                  script: npx "pnpm@$PNPM_VERSION" run format:check
                  shell: bash
                id: Check_Format
              - name: Lint
                run:
                  script: npx "pnpm@$PNPM_VERSION" run lint
                  shell: bash
                id: Lint
              - name: Unit Tests
                run-test:
                  script: |-
                    mkdir -p coverage reports
                    npx "pnpm@$PNPM_VERSION" run test
                  intelligence:
                    disabled: false
                  shell: bash
                  report:
                    paths:
                      - reports/**/*.xml
                id: Unit_Tests
              - name: Playwright Tests
                id: Playwright_Tests
                build:
                  uses: runPlaywrightTests
                  with:
                    config_file: playwright.config.ts
                    report_junit_path: artifacts/junit.xml
                    headless: true
                    skip_browser_install: false
                    force_install: false
                    debug: false
          name: Code Quality Checks
          id: Code_Quality_Checks
        - name: Upload Coverage
          run:
            script: hcli cov upload
            env:
              CI_ENABLE_HCLI_FOR_TESTS: "true"
            shell: bash
          id: Upload_Coverage
        - id: Build
          name: Build
          run:
            shell: bash
            script: npx "pnpm@$PNPM_VERSION" run build
        - name: Build and Push to GHCR
          id: Build_and_Push_to_GHCR
          build:
            uses: buildAndPushToDocker
            with:
              connector: ghcr
              repo: ghcr.io/ncalteen/harness
              tags:
                - <+pipeline.sequenceId>
              caching: true
        - name: BOM Orchestration
          id: BOM_Orchestration
          parallel:
            steps:
              - name: Generate SBOM
                id: Generate_SBOM
                template:
                  uses: sbomOrchestrationStep
                  with:
                    mode: generation
                    tool: Syft
                    format: spdx-json
                    source: third-party
                    provider: docker
                    container_registry: ghcr
                    image: ghcr.io/ncalteen/harness:<+pipeline.sequenceId>
                    attest: true
                    attest_type: Keyless
                    keyless_type: harness
                    drift: true
                    driftmethod: last-generated
                    memory: 500Mi
                    cpu: "0.5"
                    loglevel: info
              - name: Generate AIBOM
                id: Generate_AIBOM
                template:
                  uses: aiBomOrchestrationStep
                  with:
                    format: cyclonedx
                    repo_url: https://github.com/ncalteen/harness
                    variant: main
                    cloned_codebase: /harness
                    memory: 500Mi
                    cpu: "0.5"
        - step:
            type: Plugin
            name: Publish Release
            identifier: Publish_Release
            spec:
              connectorRef: docker
              image: plugins/github-release:latest
              settings:
                api_key: <+secrets.github_pat>
                owner: ncalteen
                repo: harness
                files: '*'
