pipeline:
  stages:
    - steps:
        - run:
            script: echo "$(date +%T)"
            shell: bash
          name: Timestamp
          id: Timestamp
      name: Init
      id: Init
    - id: Build_and_Test_Harness_Cloud
      name: Build and Test (Harness Cloud)
      clone:
        enabled: true
      cache:
        enabled: true
      steps:
        - id: setupNode
          name: Setup Node
          template:
            uses: setupNode@1.0.0
        - id: installDependenciesLinux
          name: Install Dependencies on Linux
          run:
            shell: bash
            script: npx pnpm ci
        - name: CI Checks
          id: CI_Checks
          parallel:
            steps:
              - name: Formatting
                run:
                  script: npx pnpm run format:check
                  shell: bash
                id: Formatting
              - name: Unit Tests
                run-test:
                  script: |-
                    mkdir -p coverage reports
                    npx pnpm run test
                  intelligence: { disabled: false }
                  shell: bash
                  report:
                    paths:
                      - reports/*.xml
                id: Unit_Tests
              - name: Playwright Tests
                run:
                  script: |-
                    npx pnpm run test:e2e:install
                    npx pnpm run test:e2e
                  shell: bash
                id: Playwright_Tests
        - name: Upload Coverage
          run:
            script: hcli cov upload
            env:
              CI_ENABLE_HCLI_FOR_TESTS: "true"
            shell: bash
          id: Upload_Coverage
        - id: Build
          name: Build
          run:
            shell: bash
            script: npx pnpm run build --if-present
      env:
        PNPM_VERSION: "12"
