pipeline:
  name: Next.js App
  tags: {}
  stages:
    - name: Build and Test (Harness Cloud)
      id: Build_and_Test_Harness_Cloud
      description: Builds and tests the application using Harness Cloud
      env:
        PNPM_VERSION: 12
      clone:
        enabled: true
      cache:
        enabled: true
      steps:
        - id: setupNode
          name: Setup Node
          template:
            uses: setupNode@1.0.0
        - id: install
          name: Install Dependencies
          run:
            shell: bash
            script: npx "pnpm@$PNPM_VERSION" ci
        - parallel:
            steps:
              - name: Check Format
                run:
                  script: npx "pnpm@$PNPM_VERSION" run format:check
                  shell: bash
                id: Check_Format
              - name: Lint
                run:
                  script: npx "pnpm@$PNPM_VERSION" run lint
                  shell: bash
                id: Lint
              - name: Unit Tests
                run-test:
                  script: |-
                    mkdir -p coverage reports
                    npx "pnpm@$PNPM_VERSION" run test
                  intelligence:
                    disabled: false
                  shell: bash
                  report:
                    paths:
                      - reports/**/*.xml
                id: Unit_Tests
              - name: Playwright Tests
                id: Playwright_Tests
                build:
                  uses: runPlaywrightTests
                  with:
                    config_file: playwright.config.ts
                    report_junit_path: artifacts/junit.xml
                    headless: true
                    skip_browser_install: false
                    force_install: false
                    debug: false
        - name: Upload Coverage
          run:
            script: hcli cov upload
            env:
              CI_ENABLE_HCLI_FOR_TESTS: "true"
            shell: bash
          id: Upload_Coverage
        - id: Build
          name: Build
          run:
            shell: bash
            script: npx "pnpm@$PNPM_VERSION" run build
        - name: Build and Push to GHCR
          id: Build_and_Push_to_GHCR
          build:
            uses: buildAndPushToDocker
            with:
              connector: ghcr
              repo: ghcr.io/ncalteen/harness
              tags:
                - <+pipeline.sequenceId>
                - latest
              caching: true
              platform: linux/arm64
        - parallel:
            steps:
              - name: Generate SBOM
                id: Generate_SBOM
                template:
                  uses: sbomOrchestrationStep
                  with:
                    mode: generation
                    tool: Syft
                    source: repository
                    drift: true
                    memory: 500Mi
                    cpu: "0.5"
                    loglevel: info
                    format: spdx-json
                    repourl: https://github.com/ncalteen/harness
                    sourcepath: Dockerfile
                    repobranch: main
                    drift_branch: main
              - name: Generate AIBOM
                id: Generate_AIBOM
                template:
                  uses: aiBomOrchestrationStep
                  with:
                    format: cyclonedx
                    repo_url: https://github.com/ncalteen/harness
                    variant: main
                    cloned_codebase: /harness
                    memory: 500Mi
                    cpu: "0.5"
    - name: Deploy
      id: Deploy
      service:
        type: kubernetes
        items:
          - harness_service
      environment:
        items:
          - id: dev
            deploy-to: local_cluster
      steps:
        - name: Kubernetes Blue Green Deploy
          id: k8sBlueGreenDeployStep
          template:
            uses: k8sBlueGreenDeployStep
        - name: Kubernetes Blue Green Swap Services Selectors
          id: k8sBlueGreenSwapServicesSelectorsStep
          template:
            uses: k8sBlueGreenSwapServicesSelectorsStep
            with:
              stable_service: ${{stage.steps.k8sBlueGreenDeployStep.output.outputVariables.stableService}}
              stage_service: ${{stage.steps.k8sBlueGreenDeployStep.output.outputVariables.stageService}}
              is_openshift: ${{stage.steps.k8sBlueGreenDeployStep.output.outputVariables.isOpenshift}}
      rollback:
        - group:
            steps:
              - name: Kubernetes Blue Green Rollback Swap Services Selectors
                id: k8sBlueGreenRollbackSwapServicesSelectorsStep
                template:
                  uses: k8sBlueGreenSwapServicesSelectorsStep
                  with:
                    stable_service: ${{rollback.data.PLUGIN_STABLE_SERVICE}}
                    stage_service: ${{rollback.data.PLUGIN_STAGE_SERVICE}}
                    is_openshift: ${{rollback.data.HARNESS_IS_OPENSHIFT}}
          id: k8sBlueGreenRollback
          name: Kubernetes Blue Green Rollback
      on-failure:
        errors: all
        action: stage-rollback
      runtime:
        kubernetes:
          namespace: harness-delegate-ng
          connector: local_kubernetes_connector
