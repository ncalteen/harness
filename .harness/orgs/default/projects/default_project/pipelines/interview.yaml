pipeline:
  name: Next.js App
  tags: {}
  stages:
    - name: Build and Test (Harness Cloud)
      id: Build_and_Test_Harness_Cloud
      description: Builds and tests the application using Harness Cloud
      env:
        PNPM_VERSION: 12
      clone:
        enabled: true
      cache:
        enabled: true
      steps:
        - id: setupNode
          name: Setup Node
          template:
            uses: setupNode@1.0.0
        - id: install
          name: Install Dependencies
          run:
            shell: bash
            script: npx "pnpm@$PNPM_VERSION" ci
        - parallel:
            steps:
              - name: Check Format
                run:
                  script: npx "pnpm@$PNPM_VERSION" run format:check
                  shell: bash
                id: Check_Format
              - name: Lint
                run:
                  script: npx "pnpm@$PNPM_VERSION" run lint
                  shell: bash
                id: Lint
              - name: Unit Tests
                run-test:
                  script: |-
                    mkdir -p coverage reports
                    npx "pnpm@$PNPM_VERSION" run test
                  intelligence:
                    disabled: false
                  shell: bash
                  report:
                    paths:
                      - reports/**/*.xml
                id: Unit_Tests
              - name: Playwright Tests
                run:
                  script: |-
                    npx "pnpm@$PNPM_VERSION" run test:e2e:install
                    npx "pnpm@$PNPM_VERSION" run test:e2e
                  shell: bash
                id: Playwright_Tests
        - name: Upload Coverage
          run:
            script: hcli cov upload
            env:
              CI_ENABLE_HCLI_FOR_TESTS: "true"
            shell: bash
          id: Upload_Coverage
        - id: Build
          name: Build
          run:
            shell: bash
            script: npx "pnpm@$PNPM_VERSION" run build
        - name: Build and Push to GHCR
          id: Build_and_Push_to_GHCR
          build:
            uses: buildAndPushToDocker
            with:
              connector: ghcr
              repo: ghcr.io/ncalteen/harness
              tags:
                - <+pipeline.sequenceId>
              caching: true
